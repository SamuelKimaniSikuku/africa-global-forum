<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><rect width="1200" height="340" fill="#f7f4ed"/><rect x="20" y="24" width="374" height="290" rx="12" fill="white" stroke="#d5d0c7" stroke-width="2"/><text x="43" y="84" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#b28b2f">THIS WEEK</text><text x="43" y="143" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#181715">START</text><text x="43" y="222" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#181715">Choose one difficulty.</text><text x="43" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#181715">Try one feasible action.</text><rect x="413" y="24" width="374" height="290" rx="12" fill="white" stroke="#d5d0c7" stroke-width="2"/><text x="436" y="84" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#a84327">AT YOUR REVIEW</text><text x="436" y="143" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#181715">NOTICE</text><text x="436" y="222" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#181715">What helped?</text><text x="436" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#181715">What got in the way?</text><rect x="806" y="24" width="374" height="290" rx="12" fill="white" stroke="#d5d0c7" stroke-width="2"/><text x="829" y="84" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3d6558">WHEN LIFE CHANGES</text><text x="829" y="143" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#181715">ADAPT</text><text x="829" y="222" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#181715">Keep, adjust or stop.</text><text x="829" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#181715">Ask for support if needed.</text></svg>