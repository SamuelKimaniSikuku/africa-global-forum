name: Refresh FX rates

on:
  schedule:
    # Daily at 06:10 UTC — open.er-api.com publishes new reference rates once a day
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh mid-market rates
        run: python3 scripts/refresh_rates.py

      - name: Prerender static board content
        run: python3 scripts/prerender_board.py

      - name: Commit updated rates + prerender (if changed)
        run: |
          if git diff --quiet data/fintech-board.json corridor-board/index.html sitemap.xml; then
            echo "No change today — nothing to commit."
            exit 0
          fi
          git config user.name "agf-rates-bot"
          git config user.email "admin@africaglobalforum.com"
          git add data/fintech-board.json corridor-board/index.html sitemap.xml
          git commit -m "Daily FX rate refresh + prerender ($(date -u +%F))"
          git push
